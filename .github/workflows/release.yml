name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm trusted publishing and the MCP Registry login both prove the publish came from this workflow.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # npm advises against caches in release builds.
          package-manager-cache: false
      - run: npm ci
      - name: Check tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          for v in $(jq -r '.version, .packages[].version' server.json); do
            [ "$v" = "$version" ] || { echo "server.json has version $v, package.json $version"; exit 1; }
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run build
      # One fixed name, so releases/latest/download/albert-heijn-mcp.tgz always works; the tag in the URL picks a version.
      - name: Pack
        run: mv "$(npm pack --silent)" albert-heijn-mcp.tgz
      # Creates the release with generated notes unless it already exists (e.g. drafted by hand).
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "albert-heijn-mcp $VERSION" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" albert-heijn-mcp.tgz --clobber
      # Trusted publishing: npm accepts this workflow's OIDC identity, so no token is stored. Provenance is
      # added automatically. A version already on npm (e.g. the first one, published by hand) is skipped.
      - name: Publish to npm
        run: |
          if [ "$(npm view "albert-heijn-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "albert-heijn-mcp $VERSION is already on npm"
          else
            npm publish albert-heijn-mcp.tgz --access public
          fi
      # The registry checks that the npm package's mcpName matches server.json.
      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
