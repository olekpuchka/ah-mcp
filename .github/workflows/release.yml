name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run build
      # One fixed name, so releases/latest/download/ah-mcp.tgz always works; the tag in the URL picks a version.
      - name: Pack
        run: mv "$(npm pack --silent)" ah-mcp.tgz
      # Creates the release with generated notes unless it already exists (e.g. drafted by hand).
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "ah-mcp $VERSION" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" ah-mcp.tgz --clobber
